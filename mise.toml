[tools]
go = "latest"
hk = "latest"
"github:nnutter/mdlint" = "latest"
"go:github.com/nnutter/git-review" = "latest"
shellcheck = "latest"

[tasks.all]
description = "Run checks and tests"
depends = ["check", "test"]

[tasks.setup]
description = "Install hk git hooks"
run = "mise exec -- hk install --mise"

[tasks.fix-mdlint]
description = "Format and fix Markdown"
usage = 'arg "[staged_files]" var=#true'
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ -z "${usage_staged_files:-}" ]; then
  mdlint format
  mdlint check --fix
  exit 0
fi
md_files=""
for f in ${usage_staged_files}; do
  case "$f" in *.md) md_files="$md_files $f" ;; esac
done
[ -z "$md_files" ] && exit 0
# shellcheck disable=SC2086
mdlint format $md_files
# shellcheck disable=SC2086
mdlint check --fix $md_files
'''

[tasks.check-mdlint]
description = "Check Markdown formatting and lint without writing"
usage = 'arg "[staged_files]" var=#true'
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ -z "${usage_staged_files:-}" ]; then
  mdlint format --check
  mdlint check --no-fix
  exit 0
fi
md_files=""
for f in ${usage_staged_files}; do
  case "$f" in *.md) md_files="$md_files $f" ;; esac
done
[ -z "$md_files" ] && exit 0
# shellcheck disable=SC2086
mdlint format --check $md_files
# shellcheck disable=SC2086
mdlint check --no-fix $md_files
'''

[tasks.check-shellcheck]
description = "Check integration scripts with ShellCheck"
run = "shellcheck skill-tests/verify-tasks.sh"

[tasks.fix]
description = "Format and fix Markdown"
usage = 'arg "[staged_files]" var=#true'
run = "mise run fix-mdlint ${usage_staged_files}"

[tasks.check]
description = "Check Markdown formatting and lint without writing"
usage = 'arg "[staged_files]" var=#true'
run = [
  "mise run check-mdlint ${usage_staged_files}",
  "mise run check-shellcheck",
]

[tasks.test]
description = "Run offline reference tests"
run = "python3 -B -m unittest discover -s skill-tests -v"

[tasks.test-integration]
description = "Exercise reference tasks in a disposable Go repository"
run = "bash skill-tests/verify-tasks.sh"
