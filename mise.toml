[tools]
go = "latest"
hk = "latest"
"github:nnutter/mdlint" = "latest"
"go:github.com/nnutter/timber" = "latest"
gitleaks = "latest"
shellcheck = "latest"
"pipx:skills-ref" = "0.1.1"

[tasks.all]
description = "Run checks and tests"
depends = ["check", "test"]

[tasks.setup]
description = "Install hk git hooks"
run = "mise exec -- hk install --mise"

[tasks.fix-mdlint]
description = "Format and fix Markdown"
usage = 'arg "[staged_files]" var=#true'
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ -z "${usage_staged_files:-}" ]; then
  hk fix --all --step markdown
else
  # shellcheck disable=SC2086
  hk fix --step markdown -- ${usage_staged_files}
fi
'''

[tasks.check-mdlint]
description = "Check Markdown formatting and lint without writing"
usage = 'arg "[staged_files]" var=#true'
run = '''
#!/usr/bin/env bash
set -eo pipefail
if [ -z "${usage_staged_files:-}" ]; then
  hk check --all --step markdown
else
  # shellcheck disable=SC2086
  hk check --step markdown -- ${usage_staged_files}
fi
'''

[tasks.fix]
description = "Format and fix Markdown"
usage = 'arg "[staged_files]" var=#true'
run = "mise run fix-mdlint ${usage_staged_files}"

[tasks.check]
description = "Run checks without writing"
usage = 'arg "[staged_files]" var=#true'
run = [
  "mise run check-mdlint ${usage_staged_files}",
  "agentskills validate skills/go-template",
  "hk check --all --step shellcheck",
  "hk check --all --step gitleaks",
]

[tasks.test]
description = "Run offline reference tests"
run = "python3 -B -m unittest discover -s skill-tests -v"

[tasks.test-integration]
description = "Exercise reference tasks in a disposable Go repository"
run = "bash skill-tests/verify-tasks.sh"
