# Opting into Homebrew renders the tap workflow with names substituted.
[answers]
project_name = "demo"
with_homebrew = true

[expect]
files = [".github/workflows/update-tap.yaml"]

[expect.contains]
".github/workflows/update-tap.yaml" = [
  "FORMULA_NAME: demo",
  "Release tag to publish to nnutter/homebrew-tap",
  "${{ github.event.release.tag_name }}",
]

[expect.lacks]
".github/workflows/update-tap.yaml" = ["{{ formula_name }}", "{% raw %}"]
