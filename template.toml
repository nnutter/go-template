name = "go-app"
description = "Go app scaffold: mise tasks, hk, CI, tool-pinned go.mod, optional Homebrew tap workflow"
note = "Next: go mod tidy, then mise run setup"

[questions.project_name]
type = "string"
prompt = "Project/binary name"
help = "Used for the Go module default and the Homebrew formula default"
default_from = "{{ remote.name | default(dir.name) | slugify }}"
default = "myapp"
pattern = "^[a-z][a-z0-9-]*$"
message = "must be lowercase and start with a letter"

[questions.module_path]
type = "string"
prompt = "Go module path"
default = "github.com/nnutter/{{ project_name }}"

[questions.go_version]
type = "string"
prompt = "Minimum Go version"
default = "1.27.3"
pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
message = "must look like 1.27.3"

[questions.copyright_holder]
type = "string"
prompt = "Copyright holder"
default_from = "git:user.name"
default = "Nathan Nutter"

[questions.copyright_year]
type = "string"
prompt = "Copyright year"
default = "2026"
pattern = "^[0-9]{4}$"
message = "must be a four-digit year"

[questions.with_homebrew]
type = "boolean"
prompt = "Publish a Homebrew formula via an update-tap workflow?"
default = false

[questions.formula_name]
type = "string"
prompt = "Homebrew formula name"
when = "{{ with_homebrew }}"
default = "{{ project_name }}"
default_when_skipped = true

[questions.tap_owner]
type = "string"
prompt = "Homebrew tap owner"
when = "{{ with_homebrew }}"
default = "nnutter"
default_when_skipped = true

[questions.tap_repository]
type = "string"
prompt = "Homebrew tap repository"
when = "{{ with_homebrew }}"
default = "homebrew-tap"
default_when_skipped = true
