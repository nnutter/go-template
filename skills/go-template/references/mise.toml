[tools]
go = "latest"
hk = "2.8.0"
pkl = "latest"
tombi = "latest"
yamlfmt = "latest"
gofumpt = "latest"
staticcheck = "latest"
gitleaks = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/securego/gosec/v2/cmd/gosec" = "latest"
golangci-lint = "2.15.0"
"go:github.com/alecthomas/go-check-sumtype/cmd/go-check-sumtype" = "latest"
"go:github.com/kisielk/errcheck" = "latest"
"go:github.com/nnutter/constable/cmd/constable" = "latest"
"go:go.uber.org/nilaway/cmd/nilaway" = "latest"
"github:nnutter/mdlint" = "latest"
"go:github.com/nnutter/git-review" = "latest"

[tasks.all]
description = "Run fix, test, and check"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.ci-test]
description = "Run tests with the race detector and shuffled order"
run = "go test -race -shuffle=on ./..."

[tasks.coverage]
alias = "cover"
description = "Run tests and generate coverage report"
run = "go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out"

[tasks.setup]
description = "Install hk git hooks"
run = "hk install --mise"

[tasks.pre-commit]
description = "Run the staged hk pre-commit hook"
run = "hk run pre-commit"

[tasks.test]
description = "Run tests with coverage"
run = "go test -cover ./..."

[tasks.fix]
description = "Fix all files, or safely fix only the supplied files"
usage = 'arg "[staged_files]" var=#true'
# Only the explicit all-files hook can run module-wide writers. A scoped fix
# checks go fix, testifylint, and tidy instead of changing unselected files.
run = '''
if [ -z "${usage_staged_files:-}" ]; then
  hk run fix-all --all
else
  hk fix ${usage_staged_files}
fi
'''

[tasks.check]
description = "Check all files without writing fixes"
run = "hk check --all"

[tasks.on-start]
description = "Pi mise-hooks: run fix, test, and check before agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Pi mise-hooks: fix edited files, then test and check"
usage = 'arg "[staged_files]" var=#true'
run = [
  "mise run fix ${usage_staged_files}",
  "mise run test",
  "mise run check",
]
