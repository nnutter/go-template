# Renders a project and proves every mise task works, including the
# file-arg regressions: `go fix` wants packages (not multi-dir file
# lists) and fixers must ignore non-Go files from agent hooks.
git = true

[answers]
project_name = "demo"

[expect]
files = ["mise.toml", "go.mod", "hk.pkl"]

[expect.contains]
"mise.toml" = ['go = "1.27.3"']

[commands]
rendered = ["{{ env.TEMPLATE_ROOT }}/tests/scripts/verify-tasks.sh"]
